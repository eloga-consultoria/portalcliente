# Publica as edge functions do portal no Supabase. Roda SÓ quando você clica em "Run workflow".
# Segredos necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal do Supabase (Account > Access Tokens)
#   SUPABASE_PROJECT_REF   código do projeto (ex.: skatnnwkxcbzmoohexsx)
name: Publicar funções no Supabase
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite o código do projeto que vai receber as funções (confirmação)'
        required: true
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir confirmação
        env:
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DIGITADO: ${{ inputs.confirmacao }}
        run: |
          if [ -z "$REF" ]; then echo "Cadastre o segredo SUPABASE_PROJECT_REF."; exit 1; fi
          if [ "$DIGITADO" != "$REF" ]; then echo "O código digitado não confere com SUPABASE_PROJECT_REF. Nada foi publicado."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase functions deploy admin-clientes --project-ref "$REF"
          supabase functions deploy enviar-posicionamento --project-ref "$REF"
